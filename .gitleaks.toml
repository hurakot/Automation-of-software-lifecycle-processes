title = "conference-app"

[extend]
useDefault = true

[[rules]]
id = "password-in-url"
description = "Пароль внутри строки подключения (scheme://user:password@host)"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*://[^:\s/@"']+:([^@\s/"'$]{3,})@'''
secretGroup = 1
keywords = ["://"]

[[rules]]
id = "password-assignment"
description = "Пароль, присвоенный строкой: password = \"...\""
regex = '''(?i)(?:password|passwd|pwd)[a-z0-9_]*\s*[:=]\s*["']([^"'\s$]{4,})["']'''
secretGroup = 1
keywords = ["password", "passwd", "pwd"]
