{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">Регистрация</h1>

        <form method="post" novalidate>

          <fieldset class="mb-4">
            <legend class="h6 text-muted">Аккаунт</legend>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="login" class="form-label">Логин</label>
                <input type="text" class="form-control" id="login" name="login"
                       required autocomplete="username">
              </div>
              <div class="col-md-6">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password"
                       required autocomplete="new-password">
              </div>
            </div>
          </fieldset>

          <fieldset class="mb-4">
            <legend class="h6 text-muted">ФИО</legend>
            <div class="row g-3">
              <div class="col-md-4">
                <label for="surname" class="form-label">Фамилия</label>
                <input type="text" class="form-control" id="surname" name="surname" required>
              </div>
              <div class="col-md-4">
                <label for="name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="name" name="name" required>
              </div>
              <div class="col-md-4">
                <label for="patronymic" class="form-label">
                  Отчество <span class="text-muted small">(необязательно)</span>
                </label>
                <input type="text" class="form-control" id="patronymic" name="patronymic">
              </div>
            </div>
          </fieldset>

          <fieldset class="mb-4">
            <legend class="h6 text-muted">
              Профессиональные данные <span class="small">(необязательно)</span>
            </legend>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="academic_degree" class="form-label">Учёная степень</label>
                <input type="text" class="form-control" id="academic_degree"
                       name="academic_degree" placeholder="Например, кандидат наук">
              </div>
              <div class="col-md-6">
                <label for="workplace" class="form-label">Место работы</label>
                <input type="text" class="form-control" id="workplace" name="workplace">
              </div>
              <div class="col-md-6">
                <label for="position" class="form-label">Должность</label>
                <input type="text" class="form-control" id="position" name="position">
              </div>
              <div class="col-md-6">
                <label for="research_field" class="form-label">Научное направление</label>
                <input type="text" class="form-control" id="research_field" name="research_field">
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label">Телефон</label>
                <input type="tel" class="form-control" id="phone" name="phone">
              </div>
            </div>
          </fieldset>

          <button class="btn btn-primary w-100" type="submit">Зарегистрироваться</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0">
          Уже есть аккаунт?
          <a href="{{ url_for('authentication') }}" class="text-decoration-none">Войдите</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
